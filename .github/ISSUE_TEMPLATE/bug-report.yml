name: Bug report
description: Report incorrect behavior or a regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, account identifiers, or other secrets.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact.
      placeholder: The agent stops after a failed MCP request instead of continuing.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Run `pnpm agent:once`.
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Agent loop
        - OpenCode runtime
        - Alpaca MCP
        - FMP MCP
        - CodeAct workspace
        - Strategy or risk logic
        - Build, tests, or tooling
        - Documentation
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: pnpm agent:once

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs, versions, or stack traces after removing secrets.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and account identifiers from this report.
          required: true
        - label: I reproduced this with an Alpaca paper account, not a live account.
          required: true
