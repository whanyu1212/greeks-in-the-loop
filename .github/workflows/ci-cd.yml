name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build

  container:
    name: Build container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag greeks-in-the-loop:ci .

  deploy:
    name: Deploy research job
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: research-production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/research-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # Submit async: the deploy service account is not a project Viewer, so
      # gcloud's synchronous log streaming exits 1 even when the build succeeds.
      - name: Build immutable image
        id: build
        run: >-
          gcloud builds submit
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --tag="$IMAGE"
          --async
          --format="value(id)"
          --quiet
          . | tee "$RUNNER_TEMP/build_id"
      - name: Wait for build
        run: |
          set -euo pipefail
          id="$(cat "$RUNNER_TEMP/build_id")"
          describe() {
            gcloud builds describe "$id" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --format='value(status)'
          }
          # Poll until a terminal status. Anything else (PENDING, QUEUED,
          # WORKING, STATUS_UNKNOWN) means the build is still in flight.
          while true; do
            status="$(describe)"
            case "$status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 10
          done
          echo "build $id finished: $status"
          test "$status" = "SUCCESS"
      - name: Update Cloud Run job image
        run: >-
          gcloud run jobs update "${{ vars.CLOUD_RUN_JOB }}"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --image="$IMAGE"
          --quiet
